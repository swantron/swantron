name: Hugo Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup Hugo
      run: |
        wget -q -O hugo.tar.gz https://github.com/gohugoio/hugo/releases/download/v0.155.1/hugo_extended_0.155.1_linux-amd64.tar.gz
        tar xzf hugo.tar.gz hugo
        sudo mv hugo /usr/local/bin/

    - name: Build Hugo site
      run: hugo --minify

    - name: Check for broken links
      uses: lycheeverse/lychee-action@v2
      with:
        args: --no-progress --offline './public/**/*.html'
        fail: false  # warn but don't block deploys
        jobSummary: true

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: public

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
