baseURL = 'https://swantron.com/'
locale = 'en-us'
title = 'swan tron dot com'
theme = 'paper'

# Ensure static files are served correctly with subpath baseURL
canonifyURLs = true
enableRobotsTXT = true
relativeURLs = false

# Pagination settings
[pagination]
  pagerSize = 10

# Clean permalink structure (removed /index.php/ for cleaner URLs)
[permalinks]
  posts = '/:year/:month/:day/:slug/'

[params]
  env = 'production'
  title = 'swan tron dot com'
  description = "og blog by Joseph Swanson — microcontrollers, DIY projects, and software engineering since 2005"
  author = 'swantron'
  
  # Paper theme settings
  rss = true  # show RSS icon
  
  # Disable comments (can enable later if needed)
  disablePostNavigation = false

  # Code is highlighted at build time by Hugo; the theme's bundled highlight.js (v9) adds nothing
  disableHLJS = true
  
  # Main sections for Paper theme (posts directory)
  mainSections = ['posts']
  
  # Banner image for homepage
  banner_image = '/uploads/2013/12/robot_arm-1000x288.jpg'

[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'Home'
    pageRef = '/'
    weight = 10
  
  [[menu.main]]
    identifier = 'about'
    name = 'About'
    pageRef = '/about'
    weight = 20
  
  [[menu.main]]
    identifier = 'hof'
    name = 'HoF'
    pageRef = '/hof'
    weight = 30
  
  [[menu.main]]
    identifier = 'all-posts'
    name = 'Posts'
    pageRef = '/all-posts'
    weight = 35
  
  [[menu.main]]
    identifier = 'search'
    name = 'Search'
    pageRef = '/search'
    weight = 40

# Sitemap configuration
[sitemap]
  changefreq = 'monthly'
  priority = 0.5
  filename = 'sitemap.xml'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allow HTML in markdown
